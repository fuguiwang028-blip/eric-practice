let lines=[];
function log(text){lines.push(text);result.textContent=lines.join('\n');}
async function request(label,url,options,limit){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),limit);
  const start=performance.now();
  log(label+'…');
  try{
    const response=await fetch(url,{...options,signal:controller.signal,cache:'no-store'});
    const text=await response.text();
    log(label+' HTTP '+response.status+'，耗时 '+((performance.now()-start)/1000).toFixed(1)+' 秒');
    let data;
    try{data=JSON.parse(text);}catch{throw Error('返回内容不是 JSON');}
    return {status:response.status,data};
  }catch(error){
    throw Error(label+(controller.signal.aborted?'超时（'+limit/1000+' 秒）':'失败（'+error.message+'）'));
  }finally{clearTimeout(timer);}
}
button.onclick=async()=>{
  button.disabled=true;lines=[];
  try{
    const endpoint=new URL(globalThis.ERIC_SPEECH_ENDPOINT);
    if(location.protocol!=='https:'||endpoint.protocol!=='https:')throw Error('请在正式 HTTPS 网站打开本页。');
    log('网页来源 '+location.origin);
    log('服务 '+endpoint.origin);
    const health=await request('① 跨域健康检查',new URL('/health',endpoint),{},15000);
    log('配置就绪 '+String(health.data.ready));
    if(health.status!==200||!health.data.ready)throw Error('请核对 Worker 的讯飞配置和限流绑定。');
    const post=await request('② POST 与预检',new URL('/assess',endpoint),{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'},15000);
    if(post.status!==400){
      log('接口返回 '+JSON.stringify(post.data));
      throw Error('POST 检查未得到预期的参数校验响应。');
    }
    log('POST 可以到达 Worker。');
    const score=await request('③ 教材范读评测',new URL('/assess',endpoint),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:'ship',audio:sample})},45000);
    log('评测响应 '+JSON.stringify(score.data));
    log(score.status===200?'测试完成，讯飞链路可用。':'讯飞链路返回错误，请把结果发给老师。');
  }catch(error){log(error.message);}
  finally{button.disabled=false;document.getElementById('copy').hidden=false;}
};
document.getElementById('copy').onclick=async()=>{
 try{await navigator.clipboard.writeText(result.textContent);document.getElementById('copy').textContent='已复制';}
 catch{document.getElementById('copy').textContent='请选中上面的文字复制';}
};
